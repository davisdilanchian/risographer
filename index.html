<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riso Press</title>
<style>
  :root{
    --bg:#1c1c1f; --panel:#252529; --panel2:#2e2e33; --line:#3a3a41;
    --tx:#e8e8ea; --tx2:#9a9aa2; --acc:#ff665e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex; background:var(--bg); color:var(--tx);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;
  }

  /* ---------- sidebar ---------- */
  #side{
    width:290px; flex:0 0 290px; background:var(--panel);
    border-right:1px solid var(--line); overflow-y:auto; padding:14px;
  }
  h1{font-size:14px;margin:0 0 2px;letter-spacing:.02em}
  .sub{color:var(--tx2);font-size:11px;margin-bottom:14px}
  .sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
  .sec>h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--tx2);margin:0 0 9px;font-weight:600}
  label{display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:7px;color:var(--tx2);font-size:12px}
  label>span:first-child{white-space:nowrap}
  input[type=range]{width:120px;accent-color:var(--acc)}
  input[type=number]{width:56px;background:var(--panel2);border:1px solid var(--line);
    color:var(--tx);border-radius:4px;padding:3px 5px;font:inherit;font-size:12px}
  input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line);
    border-radius:4px;background:none;cursor:pointer}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    border-radius:4px;padding:3px 5px;font:inherit;font-size:12px}
  .val{color:var(--tx);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

  button{background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    border-radius:5px;padding:6px 9px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{background:#3a3a41}
  button.pri{background:var(--acc);border-color:var(--acc);color:#1c1c1f;font-weight:600}
  button.pri:hover{filter:brightness(1.1)}
  .row{display:flex;gap:6px}
  .row>*{flex:1}

  /* ---------- folders ---------- */
  .folder{border:1px solid var(--line);border-radius:7px;padding:10px;
    margin-bottom:9px;background:var(--panel2);cursor:pointer;transition:border-color .12s}
  .folder.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .fhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .fname{font-weight:600;font-size:12px;flex:1}
  .badge{font-size:10px;color:var(--tx2);background:var(--bg);
    padding:2px 6px;border-radius:20px}
  .thumbs{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .thumb{width:40px;height:40px;border-radius:4px;object-fit:cover;
    border:2px solid transparent;cursor:pointer;background:#000}
  .thumb.sel{border-color:var(--acc)}
  .empty{color:var(--tx2);font-size:11px;font-style:italic;margin-top:7px}

  /* ---------- stage ---------- */
  #stage{flex:1;display:flex;align-items:center;justify-content:center;
    overflow:auto;padding:26px;position:relative}
  #wrap{position:relative;box-shadow:0 6px 34px rgba(0,0,0,.55);line-height:0}
  canvas{display:block;max-width:100%;max-height:calc(100vh - 52px);
    width:auto;height:auto}
  #hint{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;pointer-events:none;color:#8a8a92;
    font-size:15px;text-align:center;padding:30px}
  #drop{position:absolute;inset:0;border:3px dashed var(--acc);
    background:rgba(255,102,94,.09);display:none;pointer-events:none;z-index:5}
  body.dragover #drop{display:block}
  #stat{position:absolute;left:14px;bottom:10px;color:#6c6c74;font-size:11px}
</style>
</head>
<body>

<div id="side">
  <h1>Riso Press</h1>
  <div class="sub">Drop images into a folder. The halftone screen is fixed to the
    page, not the image &mdash; move things around and they slide through it.</div>

  <div id="folders"></div>

  <div class="sec">
    <h2>Selected image</h2>
    <div id="selbox">
      <div class="empty">Nothing selected.</div>
    </div>
  </div>

  <div class="sec">
    <h2>Screen</h2>
    <label><span>Dot size</span>
      <input type="range" id="cell" min="3" max="24" step="1" value="7">
      <span class="val" id="cellv">7</span></label>
    <label><span>Ink limit</span>
      <input type="range" id="cover" min="50" max="100" step="1" value="88">
      <span class="val" id="coverv">88</span></label>
  </div>

  <div class="sec">
    <h2>Page</h2>
    <label><span>Size</span>
      <select id="preset">
        <option value="1275x1650">Letter portrait</option>
        <option value="1650x1275">Letter landscape</option>
        <option value="1240x1754">A4 portrait</option>
        <option value="1754x1240">A4 landscape</option>
        <option value="1500x1500">Square</option>
        <option value="1350x1800">Poster 3:4</option>
      </select></label>
    <label><span>Paper</span><input type="color" id="paper" value="#f7f3ea"></label>
    <label><span>Grain</span>
      <input type="range" id="grain" min="0" max="40" step="1" value="12">
      <span class="val" id="grainv">12</span></label>
  </div>

  <div class="sec">
    <h2>Export</h2>
    <div class="row" style="margin-bottom:6px">
      <button class="pri" id="expPng">PNG</button>
      <button id="expPlates">Plates</button>
    </div>
    <div style="color:var(--tx2);font-size:11px">
      Plates exports one black-on-white file per folder for a print shop.</div>
  </div>
</div>

<div id="stage">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hint">Drag images here</div>
    <div id="drop"></div>
  </div>
  <div id="stat"></div>
</div>

<script>
"use strict";

// ------------------------------------------------------------------ state
const S = {
  page: { w: 1275, h: 1650 },
  paper: "#f7f3ea",
  cell: 7,
  cover: 0.88,
  grain: 12,
  active: 0,
  sel: null,                      // {f, i}
  folders: [
    { name: "INK 1", color: "#ff665e", angle: 15, dx: 0, dy: 0, items: [] },
    { name: "INK 2", color: "#00a95c", angle: 45, dx: 2, dy: 2, items: [] }
  ]
};

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let grainTile = null;
let dragging = null;             // {f,i,ox,oy}
let fast = false;

// ------------------------------------------------------------- utilities
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function makeGrain() {
  const n = 256, c = document.createElement("canvas");
  c.width = c.height = n;
  const g = c.getContext("2d"), d = g.createImageData(n, n);
  for (let i = 0; i < n * n; i++) {
    const v = 128 + (Math.random() - 0.5) * 190;
    d.data[i*4] = d.data[i*4+1] = d.data[i*4+2] = v;
    d.data[i*4+3] = 255;
  }
  g.putImageData(d, 0, 0);
  return c;
}

// ------------------------------------------------- density map per folder
// Composites every image in a folder into a page-size ink-density buffer.
// density = (1 - luminance) * alpha.  No image => 0 => no ink.
function densityOf(folder) {
  const { w, h } = S.page;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  for (const it of folder.items) g.drawImage(it.img, it.x, it.y, it.w, it.h);

  const px = g.getImageData(0, 0, w, h).data;
  const den = new Float32Array(w * h);
  for (let i = 0, p = 0; i < den.length; i++, p += 4) {
    const a = px[p + 3] / 255;
    if (a === 0) continue;
    const lum = (0.2126 * px[p] + 0.7152 * px[p+1] + 0.0722 * px[p+2]) / 255;
    den[i] = (1 - lum) * a;
  }
  return den;
}

// ------------------------------------------------------------- halftoning
// The lattice is generated in PAGE space, anchored at the page origin, so the
// dot grid never moves when an image moves. Two images in one folder therefore
// share a single continuous screen -- which is the whole point.
function halftone(den, folder, cell, inkColor) {
  const { w, h } = S.page;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = inkColor;

  const a = folder.angle * Math.PI / 180;
  const cs = Math.cos(a), sn = Math.sin(a);

  // page corners -> screen space, to find which lattice cells we need
  let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
  for (const [x, y] of [[0,0],[w,0],[0,h],[w,h]]) {
    const u =  x*cs + y*sn, v = -x*sn + y*cs;
    if (u < uMin) uMin = u; if (u > uMax) uMax = u;
    if (v < vMin) vMin = v; if (v > vMax) vMax = v;
  }

  const step = fast ? Math.max(2, cell >> 1) : Math.max(1, cell >> 2);
  let drawn = 0;

  g.beginPath();
  for (let vi = Math.floor(vMin/cell) - 1; vi <= Math.ceil(vMax/cell) + 1; vi++) {
    for (let ui = Math.floor(uMin/cell) - 1; ui <= Math.ceil(uMax/cell) + 1; ui++) {
      const su = (ui + 0.5) * cell, sv = (vi + 0.5) * cell;
      const x = su*cs - sv*sn, y = su*sn + sv*cs;
      if (x < -cell || y < -cell || x > w + cell || y > h + cell) continue;

      const x0 = Math.max(0, (x - cell/2) | 0), x1 = Math.min(w - 1, (x + cell/2) | 0);
      const y0 = Math.max(0, (y - cell/2) | 0), y1 = Math.min(h - 1, (y + cell/2) | 0);
      if (x1 < x0 || y1 < y0) continue;

      // cheap reject: most of a page is usually empty, so probe the corners and
      // centre before paying for the full box average
      if (!den[y0*w + x0] && !den[y0*w + x1] && !den[y1*w + x0] && !den[y1*w + x1]
          && !den[((y0+y1)>>1)*w + ((x0+x1)>>1)]) continue;

      let sum = 0, n = 0;
      for (let yy = y0; yy <= y1; yy += step)
        for (let xx = x0; xx <= x1; xx += step) { sum += den[yy*w + xx]; n++; }
      if (!n) continue;

      const d = (sum / n) * S.cover;
      if (d < 0.008) continue;

      // Dot AREA must equal the tone, so r = cell*sqrt(d/PI) -> factor 0.5642.
      // That alone never fills solid (circles on a square lattice leave corner
      // gaps until r reaches cell/sqrt(2) = 0.707), so ramp the factor up over
      // the top of the range: exact in the midtones, genuinely solid at max ink.
      const f = 0.5642 + 0.1428 * clamp((d - 0.7) / 0.3, 0, 1);
      const r = cell * f * Math.sqrt(d);
      if (r < 0.12) continue;
      g.moveTo(x + r, y);
      g.arc(x, y, r, 0, 6.2831853);
      drawn++;
    }
  }
  g.fill();
  return { canvas: c, drawn };
}

// ------------------------------------------------------------------ draw
function render() {
  const { w, h } = S.page;
  cv.width = w; cv.height = h;

  ctx.fillStyle = S.paper;
  ctx.fillRect(0, 0, w, h);

  const t0 = performance.now();
  let dots = 0;

  for (const f of S.folders) {
    if (!f.items.length) continue;
    const den = densityOf(f);
    const { canvas, drawn } = halftone(den, f, S.cell, f.color);
    dots += drawn;
    ctx.globalCompositeOperation = "multiply";
    ctx.drawImage(canvas, f.dx, f.dy);       // misregistration
    ctx.globalCompositeOperation = "source-over";
  }

  if (S.grain > 0) {
    if (!grainTile) grainTile = makeGrain();
    ctx.save();
    ctx.globalAlpha = S.grain / 100;
    ctx.globalCompositeOperation = "overlay";
    const p = ctx.createPattern(grainTile, "repeat");
    ctx.fillStyle = p;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  // selection outline
  if (S.sel) {
    const it = S.folders[S.sel.f].items[S.sel.i];
    if (it) {
      ctx.save();
      ctx.strokeStyle = "#1e90ff";
      ctx.lineWidth = Math.max(2, w / 500);
      ctx.setLineDash([10, 7]);
      ctx.strokeRect(it.x, it.y, it.w, it.h);
      ctx.restore();
    }
  }

  const total = S.folders.reduce((a, f) => a + f.items.length, 0);
  document.getElementById("hint").style.display = total ? "none" : "flex";
  document.getElementById("stat").textContent =
    `${Math.round(performance.now() - t0)} ms · ${dots.toLocaleString()} dots` +
    (fast ? " · preview" : "");
}

let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

// ------------------------------------------------------------ adding art
function addImage(img, folderIndex, cx, cy) {
  const f = S.folders[folderIndex];
  const maxW = S.page.w * 0.6;
  const sc = Math.min(1, maxW / img.naturalWidth);
  const w = img.naturalWidth * sc, h = img.naturalHeight * sc;
  const it = {
    img,
    x: clamp((cx ?? S.page.w / 2) - w / 2, -w * .3, S.page.w - w * .7),
    y: clamp((cy ?? S.page.h / 2) - h / 2, -h * .3, S.page.h - h * .7),
    w, h
  };
  f.items.push(it);
  S.sel = { f: folderIndex, i: f.items.length - 1 };
  buildFolders(); buildSel(); draw();
}

function loadFiles(files, cx, cy) {
  [...files].filter(f => f.type.startsWith("image/")).forEach((file, k) => {
    const img = new Image();
    img.onload = () => addImage(img, S.active, (cx ?? S.page.w/2) + k*26, (cy ?? S.page.h/2) + k*26);
    img.src = URL.createObjectURL(file);
  });
}

// ------------------------------------------------------------------- UI
function buildFolders() {
  const host = document.getElementById("folders");
  host.innerHTML = "";
  S.folders.forEach((f, fi) => {
    const el = document.createElement("div");
    el.className = "folder" + (fi === S.active ? " active" : "");
    el.innerHTML = `
      <div class="fhead">
        <input type="color" value="${f.color}" data-c="${fi}" title="Ink colour">
        <div class="fname">${f.name}</div>
        <div class="badge">${f.items.length}</div>
      </div>
      <label><span>Angle</span>
        <input type="range" min="0" max="90" step="1" value="${f.angle}" data-a="${fi}">
        <span class="val">${f.angle}&deg;</span></label>
      <label><span>Offset</span>
        <input type="range" min="-8" max="8" step="1" value="${f.dx}" data-o="${fi}">
        <span class="val">${f.dx}</span></label>
      <div class="thumbs" data-t="${fi}"></div>
      ${f.items.length ? "" : '<div class="empty">Drop images here &mdash; click this folder first.</div>'}`;
    el.onclick = e => {
      if (e.target.closest("input,.thumb")) return;
      S.active = fi; buildFolders();
    };
    host.appendChild(el);

    const tw = el.querySelector(`[data-t="${fi}"]`);
    f.items.forEach((it, i) => {
      const t = document.createElement("img");
      t.className = "thumb" + (S.sel && S.sel.f === fi && S.sel.i === i ? " sel" : "");
      t.src = it.img.src;
      t.onclick = () => { S.active = fi; S.sel = { f: fi, i }; buildFolders(); buildSel(); draw(); };
      tw.appendChild(t);
    });
  });

  host.querySelectorAll("[data-c]").forEach(inp => inp.oninput = e => {
    S.folders[+e.target.dataset.c].color = e.target.value; draw();
  });
  host.querySelectorAll("[data-a]").forEach(inp => inp.oninput = e => {
    const f = S.folders[+e.target.dataset.a];
    f.angle = +e.target.value;
    e.target.nextElementSibling.textContent = f.angle + "°";
    draw();
  });
  host.querySelectorAll("[data-o]").forEach(inp => inp.oninput = e => {
    const f = S.folders[+e.target.dataset.o];
    f.dx = f.dy = +e.target.value;
    e.target.nextElementSibling.textContent = f.dx;
    draw();
  });
}

function buildSel() {
  const box = document.getElementById("selbox");
  if (!S.sel || !S.folders[S.sel.f].items[S.sel.i]) {
    box.innerHTML = '<div class="empty">Nothing selected. Click an image on the page.</div>';
    return;
  }
  const it = S.folders[S.sel.f].items[S.sel.i];
  const pct = Math.round(it.w / it.img.naturalWidth * 100);
  box.innerHTML = `
    <label><span>Size</span>
      <input type="range" id="sz" min="5" max="200" step="1" value="${clamp(pct,5,200)}">
      <span class="val" id="szv">${pct}%</span></label>
    <div class="row" style="margin-top:8px">
      <button id="mv">Move to ${S.folders[1 - S.sel.f].name}</button>
      <button id="del">Delete</button>
    </div>`;

  document.getElementById("sz").oninput = e => {
    const p = +e.target.value / 100;
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
    it.w = it.img.naturalWidth * p; it.h = it.img.naturalHeight * p;
    it.x = cx - it.w / 2; it.y = cy - it.h / 2;
    document.getElementById("szv").textContent = Math.round(p * 100) + "%";
    draw();
  };
  document.getElementById("mv").onclick = () => {
    const from = S.sel.f, to = 1 - from;
    const [m] = S.folders[from].items.splice(S.sel.i, 1);
    S.folders[to].items.push(m);
    S.sel = { f: to, i: S.folders[to].items.length - 1 };
    S.active = to; buildFolders(); buildSel(); draw();
  };
  document.getElementById("del").onclick = () => {
    S.folders[S.sel.f].items.splice(S.sel.i, 1);
    S.sel = null; buildFolders(); buildSel(); draw();
  };
}

// -------------------------------------------------------------- pointer
function toPage(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (cv.width / r.width),
           y: (e.clientY - r.top) * (cv.height / r.height) };
}

function hit(p) {
  for (let fi = S.folders.length - 1; fi >= 0; fi--) {
    const items = S.folders[fi].items;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (p.x >= it.x && p.x <= it.x + it.w && p.y >= it.y && p.y <= it.y + it.h)
        return { f: fi, i };
    }
  }
  return null;
}

cv.addEventListener("pointerdown", e => {
  const p = toPage(e);
  const h = hit(p);
  S.sel = h;
  if (h) {
    const it = S.folders[h.f].items[h.i];
    dragging = { ...h, ox: p.x - it.x, oy: p.y - it.y };
    fast = true;
    cv.setPointerCapture(e.pointerId);
    S.active = h.f;
  }
  buildFolders(); buildSel(); draw();
});

cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  const p = toPage(e);
  const it = S.folders[dragging.f].items[dragging.i];
  it.x = p.x - dragging.ox;
  it.y = p.y - dragging.oy;
  draw();
});

addEventListener("pointerup", () => {
  if (!dragging) return;
  dragging = null; fast = false; draw();
});

cv.addEventListener("wheel", e => {
  if (!S.sel) return;
  const it = S.folders[S.sel.f].items[S.sel.i];
  if (!it) return;
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.06 : 1 / 1.06;
  const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
  it.w = clamp(it.w * k, 24, S.page.w * 4);
  it.h = it.w * (it.img.naturalHeight / it.img.naturalWidth);
  it.x = cx - it.w / 2; it.y = cy - it.h / 2;
  buildSel(); draw();
}, { passive: false });

addEventListener("keydown", e => {
  if (!S.sel) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    S.folders[S.sel.f].items.splice(S.sel.i, 1);
    S.sel = null; buildFolders(); buildSel(); draw();
  }
  const it = S.folders[S.sel.f]?.items[S.sel.i];
  if (it && e.key.startsWith("Arrow")) {
    e.preventDefault();
    const d = e.shiftKey ? 10 : 1;
    if (e.key === "ArrowLeft") it.x -= d;
    if (e.key === "ArrowRight") it.x += d;
    if (e.key === "ArrowUp") it.y -= d;
    if (e.key === "ArrowDown") it.y += d;
    draw();
  }
});

// ------------------------------------------------------------ drag & drop
addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragover"); });
addEventListener("dragleave", e => { if (e.relatedTarget === null) document.body.classList.remove("dragover"); });
addEventListener("drop", e => {
  e.preventDefault();
  document.body.classList.remove("dragover");
  const r = cv.getBoundingClientRect();
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  const p = inside ? toPage(e) : { x: S.page.w / 2, y: S.page.h / 2 };
  loadFiles(e.dataTransfer.files, p.x, p.y);
});
addEventListener("paste", e => {
  const f = [...(e.clipboardData?.files || [])];
  if (f.length) loadFiles(f);
});

// ------------------------------------------------------------- controls
const bind = (id, fn, label) => {
  const el = document.getElementById(id);
  el.oninput = () => {
    fn(el.value);
    if (label) document.getElementById(label).textContent = el.value;
    draw();
  };
};
bind("cell",  v => S.cell = +v,        "cellv");
bind("cover", v => S.cover = +v / 100, "coverv");
bind("grain", v => S.grain = +v,       "grainv");
document.getElementById("paper").oninput = e => { S.paper = e.target.value; draw(); };
document.getElementById("preset").onchange = e => {
  const [w, h] = e.target.value.split("x").map(Number);
  S.page = { w, h }; draw();
};

// --------------------------------------------------------------- export
function save(canvas, name) {
  canvas.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

document.getElementById("expPng").onclick = () => {
  const keep = S.sel; S.sel = null; render();
  save(cv, "riso.png");
  S.sel = keep; draw();
};

document.getElementById("expPlates").onclick = () => {
  S.folders.forEach((f, i) => {
    if (!f.items.length) return;
    const den = densityOf(f);
    const { canvas } = halftone(den, f, S.cell, "#000000");
    const out = document.createElement("canvas");
    out.width = S.page.w; out.height = S.page.h;
    const g = out.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, out.width, out.height);
    g.drawImage(canvas, 0, 0);
    save(out, `plate-${i + 1}-${f.name.replace(/\s+/g, "")}.png`);
  });
};

// ------------------------------------------------------------------ boot
buildFolders(); buildSel(); draw();

// test hook
window.__riso = { S, addImage, render, loadURL(url, f) {
  const img = new Image();
  img.onload = () => addImage(img, f ?? S.active);
  img.src = url;
}};
